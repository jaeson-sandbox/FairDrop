# The reproducible cross-platform verification gate for FairDrop.
#
# This is the whole gate, run natively on both platforms FairDrop ships to.
# Linux separately verifies Go adapters; it is not release proof.
# internal/*_windows.go / internal/*_darwin.go are only analysed,
# built, and tested on the job whose OS actually compiles them. Toolchains
# are pinned so the verified state does not silently drift between runs.
#
# verify_workflow_test.go pins every load-bearing line below and fails,
# naming the break, if a pin is loosened.
name: Verify

# Read-only, stated rather than inherited. This workflow runs on every pull
# request, including from a fork, and is reused as the release gate -- so the
# token it hands those runs must not depend on a repository setting a person
# can change in a web form.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - 'epic-*'
  # Lets release.yml reuse this exact gate with `uses: ./.github/workflows/verify.yml`
  # rather than copying it -- a copied gate drifts. No inputs or secrets: the
  # release job runs on the same triggering ref and needs nothing passed in.
  workflow_call:

# A new push or PR update supersedes any run already in flight for the same
# ref, so stale results never race a newer commit to green.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The Wails CLI is not resolved from go.mod (it is a separate `go install`),
  # so its version is pinned here rather than left to whatever `@latest`
  # resolves to on a given day.
  WAILS_VERSION: 'v2.15.0'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung npm ci or wails build otherwise burns the multi-hour default
    # before GitHub kills it. The full gate takes about four minutes.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Provision native Windows UNC fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'fairdrop-native-unc'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $fixture 'report.txt'), 'native matrix payload')
          New-SmbShare -Name FairDropNativeMatrix -Path $fixture -FullAccess ([Security.Principal.WindowsIdentity]::GetCurrent().Name) | Out-Null
          'FAIRDROP_TEST_UNC_FILE=\\localhost\FairDropNativeMatrix\report.txt' >> $env:GITHUB_ENV
          'FAIRDROP_TEST_UNC_DIRECTORY=\\localhost\FairDropNativeMatrix' >> $env:GITHUB_ENV

      # actions/setup-go does not guarantee $(go env GOPATH)/bin is on PATH
      # for every step shell on every platform, and that is where `go
      # install` puts the Wails CLI -- so add it explicitly rather than
      # trust an implicit default.
      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache the Wails CLI
        id: cache-wails
        uses: actions/cache@v6
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # An unpinned or drifted CLI must fail before any build runs, not
      # produce a build from whichever version happened to be cached or
      # resolved.
      - name: Assert the Wails CLI is pinned
        run: |
          got="$(wails version | head -n1 | tr -d '\r')"
          if [ "$got" != "$WAILS_VERSION" ]; then
            echo "wails version reported '$got', want '$WAILS_VERSION'" >&2
            exit 1
          fi

      # wails build runs `frontend:install` (a full `npm ci`, dev
      # dependencies included: `npm run build` needs the devDependency-only
      # Vite and tsc, so a production-flavored install can never build) and
      # regenerates frontend/wailsjs before compiling Go.
      - name: wails build
        run: wails build

      - name: Native macOS unusable-lock launch smoke
        if: runner.os == 'macOS'
        run: bash scripts/smoke-darwin-unusable-lock.sh

      # A regenerated-but-uncommitted frontend/wailsjs means the committed
      # bindings are stale, and a missing frontend/dist/.gitkeep would break
      # embedding on the next clean clone.
      #
      # core.fileMode=false because the macOS generator writes the binding
      # files 0755 while they are committed 0644, so every macOS run reports
      # a mode-only diff. A permission bit is not stale bindings; content is.
      - name: Check for bindings drift and a restored .gitkeep
        run: |
          if [ ! -f frontend/dist/.gitkeep ]; then
            echo "frontend/dist/.gitkeep is missing after wails build" >&2
            exit 1
          fi
          if ! git -c core.fileMode=false diff --quiet -- frontend/wailsjs; then
            echo "wails build changed frontend/wailsjs -- the committed bindings are stale:" >&2
            git -c core.fileMode=false diff -- frontend/wailsjs >&2
            exit 1
          fi

      - name: gofmt -l
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go tool staticcheck ./...

      - name: go test
        run: go test -count=1 -timeout 240s ./...

      - name: Report native platform coverage and capability skips
        if: always()
        run: go test -count=1 -v -run 'Test(POSIX|Linux|Darwin|Native|StageTransferResolves|StageTransferRefusesSelected)' ./...

      # go test -race silently reports clean when cgo is unavailable rather
      # than failing, so confirm both the flag and a working C toolchain
      # before trusting the race step that follows.
      - name: Confirm cgo is enabled
        run: |
          enabled="$(go env CGO_ENABLED)"
          if [ "$enabled" != "1" ]; then
            echo "CGO_ENABLED=$enabled, want 1: no C toolchain was detected for this runner" >&2
            exit 1
          fi
          probe="$RUNNER_TEMP/fairdrop_cgo_probe.go"
          cat > "$probe" <<'EOF'
          package main

          // #include <stdio.h>
          import "C"

          func main() {}
          EOF
          if ! go run "$probe"; then
            echo "CGO_ENABLED=1 but a trivial cgo program failed to build and run: the C toolchain is broken or missing" >&2
            exit 1
          fi

      # Native windows-latest and macos-latest runners ship a working C
      # toolchain (MSYS2 gcc on Windows, Xcode command line tools on macOS),
      # so -race is expected to run for real here; the step above is what
      # makes a silent regression to a cgo-less runner fail loudly instead
      # of reporting a clean race run that never actually detected anything.
      - name: go test -race
        run: go test -count=1 -race -timeout 420s ./...

      - name: Frontend suite
        working-directory: frontend
        run: npm test

      - name: Line-ending check
        run: |
          bad="$(git ls-files --eol | grep -E '(i|w)/(crlf|mixed)' || true)"
          if [ -n "$bad" ]; then
            echo "non-LF line endings found:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Remove native Windows UNC share
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-SmbShare -Name FairDropNativeMatrix -Force -ErrorAction SilentlyContinue

      - name: Prove native acceptance tests detect broken guards
        if: always()
        run: bash scripts/verify-native-mutations.sh

  linux-adapters:
    name: Linux adapter verification (not release proof)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
      - name: Vet Go adapters
        run: go vet ./...
      - name: Execute Go suite and report capability skips
        run: go test -count=1 -v -timeout 240s ./...
      - name: Execute adapter race suite
        run: |
          test "$(go env CGO_ENABLED)" = 1
          go test -count=1 -race -timeout 420s ./...
      - name: Prove native acceptance tests detect broken guards
        run: bash scripts/verify-native-mutations.sh
